name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # Natural file ordering and the time formats, on the plain JVM.
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/bookjam.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            ALIAS="$KEY_ALIAS"; STOREPW="$STORE_PASSWORD"; KEYPW="$KEY_PASSWORD"
            echo "Signing with the keystore from repository secrets."
          else
            # No secrets configured: sign with a throwaway key so the APK still
            # installs. Every build then has a different signature, so uninstall
            # the previous build before installing a new one.
            ALIAS=bookjam; STOREPW=bookjam; KEYPW=bookjam
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -storepass "$STOREPW" -keypass "$KEYPW" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=BookJam CI, OU=Build, O=BookJam, C=ZZ"
            echo "No KEYSTORE_BASE64 secret: signed with a throwaway CI key."
          fi
          echo "::add-mask::$STOREPW"
          echo "::add-mask::$KEYPW"
          {
            echo "BJ_STORE_FILE=$KS"
            echo "BJ_STORE_PASSWORD=$STOREPW"
            echo "BJ_KEY_ALIAS=$ALIAS"
            echo "BJ_KEY_PASSWORD=$KEYPW"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PbjStoreFile="$BJ_STORE_FILE" \
            -PbjStorePassword="$BJ_STORE_PASSWORD" \
            -PbjKeyAlias="$BJ_KEY_ALIAS" \
            -PbjKeyPassword="$BJ_KEY_PASSWORD"

      - name: Report size
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SIZE=$(stat -c%s "$APK")
          echo "### APK: $(basename "$APK") - $((SIZE / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| entry | compressed |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | sort -rn | head -8 \
            | awk '{printf "| %s | %s bytes |\n", $4, $1}' >> "$GITHUB_STEP_SUMMARY"
          # No libraries means this stays tiny; fail if that ever changes.
          LIMIT=$((1536 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "APK grew to $SIZE bytes, over the $LIMIT byte budget." >&2
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: bookjam-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "$APK_PATH" --generate-notes

  smoke:
    name: Listen to a book on an emulator
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: bookjam-apk
          path: apk

      # Two little audiobooks of beeping WAV files and a cover, made on the spot.
      - name: Make test books
        run: python3 tools/make_test_books.py testbooks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the real APK on an Android 14 emulator, adds the test books
      # through the system folder picker and listens to them: skips, chapter
      # jumps and undo, speed, the sleep timer, the screen off, kill -9 and
      # coming back. Fails on any crash. Screenshots are uploaded.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/smoke_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: warn
